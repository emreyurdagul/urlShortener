global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  # Replicas are scraped individually so per-instance latency and health
  # are visible; the service-name alias would round-robin between them.
  - job_name: link-service
    static_configs:
      - targets:
          - "link-service-1:8080"
          - "link-service-2:8080"
          - "link-service-3:8080"

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8080"]
