# Production stack for Coolify (Docker Compose build pack).
#
# Public services (web, gateway, grafana) are routed by explicit Traefik labels
# and joined to Coolify's external `coolify` proxy network. TLS is terminated by
# Traefik with its default cert; Cloudflare sits in front in "Full" SSL mode, so
# the edge presents a valid cert to browsers. Internal services stay on the
# default (per-app) network only, reachable by service name.
#
# Local dev uses docker-compose.local.yml (host ports, no Traefik).
name: urlshortener

services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    environment:
      GATEWAY_CONFIG: /app/gateway.json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      RATE_LIMIT_BURST: 60
      RATE_LIMIT_PER_SECOND: 30
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.urlshort-gw.rule=Host(`api-kisalt.etkinlikgalerim.online`)"
      - traefik.http.routers.urlshort-gw.entrypoints=https
      - traefik.http.routers.urlshort-gw.tls=true
      - traefik.http.services.urlshort-gw.loadbalancer.server.port=8080
    depends_on:
      - link-service-1
      - link-service-2
      - link-service-3
      - auth-service
      - analytics-service

  link-service-1:
    build:
      context: .
      dockerfile: src/LinkService/Dockerfile
    environment:
      ConnectionStrings__Db: Host=postgres;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener};Database=shortener
      LINK_DOMAINS: ${LINK_DOMAINS:-api-kisalt.etkinlikgalerim.online}
      ANALYTICS_URL: http://analytics-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  link-service-2:
    build:
      context: .
      dockerfile: src/LinkService/Dockerfile
    environment:
      ConnectionStrings__Db: Host=postgres;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener};Database=shortener
      LINK_DOMAINS: ${LINK_DOMAINS:-api-kisalt.etkinlikgalerim.online}
      ANALYTICS_URL: http://analytics-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  link-service-3:
    build:
      context: .
      dockerfile: src/LinkService/Dockerfile
    environment:
      ConnectionStrings__Db: Host=postgres;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener};Database=shortener
      LINK_DOMAINS: ${LINK_DOMAINS:-api-kisalt.etkinlikgalerim.online}
      ANALYTICS_URL: http://analytics-service:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    environment:
      ConnectionStrings__Db: Host=postgres;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener};Database=shortener
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: src/AnalyticsService/Dockerfile
    environment:
      ConnectionStrings__Db: Host=postgres;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener};Database=shortener
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The monolith counterpart — same features as one layered process, on its own
  # subdomain with its own Postgres (isolated data), so the micro-vs-mono
  # comparison stays clean. Shares this app's JWT_SECRET/POSTGRES_PASSWORD.
  monolith:
    build:
      context: .
      dockerfile: src/Monolith/Dockerfile
    environment:
      ConnectionStrings__Db: Host=postgres-mono;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener};Database=shortener
      LINK_DOMAINS: mono-kisalt.etkinlikgalerim.online
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      RATE_LIMIT_BURST: 60
      RATE_LIMIT_PER_SECOND: 30
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    expose:
      - "8080"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.urlshort-mono.rule=Host(`mono-kisalt.etkinlikgalerim.online`)"
      - traefik.http.routers.urlshort-mono.entrypoints=https
      - traefik.http.routers.urlshort-mono.tls=true
      - traefik.http.services.urlshort-mono.loadbalancer.server.port=8080
    depends_on:
      postgres-mono:
        condition: service_healthy

  postgres-mono:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
      POSTGRES_DB: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata_mono:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Server-side rewrite target for /api/* (browser stays same-origin).
        GATEWAY_URL: http://gateway:8080
        # Baked into the client bundle; the gateway's public wss URL.
        NEXT_PUBLIC_GATEWAY_WS: ${GATEWAY_WS:-wss://api-kisalt.etkinlikgalerim.online/ws/metrics}
    environment:
      GATEWAY_URL: http://gateway:8080
    expose:
      - "3001"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.urlshort-web.rule=Host(`kisalt.etkinlikgalerim.online`)"
      - traefik.http.routers.urlshort-web.entrypoints=https
      - traefik.http.routers.urlshort-web.tls=true
      - traefik.http.services.urlshort-web.loadbalancer.server.port=3001
    depends_on:
      - gateway

  # Grafana Tempo — receives OTLP traces from every service (4317) and answers
  # Grafana's trace queries (3200). Traces sit next to metrics in one Grafana.
  tempo:
    build:
      context: ./deploy/tempo
      dockerfile: Dockerfile
    expose:
      - "3200"
      - "4317"

  prometheus:
    build:
      context: ./deploy/prometheus
      dockerfile: Dockerfile
    expose:
      - "9090"
    depends_on:
      - gateway

  grafana:
    build:
      context: ./deploy/grafana
      dockerfile: Dockerfile
    environment:
      GF_SERVER_ROOT_URL: https://grafana-kisalt.etkinlikgalerim.online
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    expose:
      - "3000"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.urlshort-graf.rule=Host(`grafana-kisalt.etkinlikgalerim.online`)"
      - traefik.http.routers.urlshort-graf.entrypoints=https
      - traefik.http.routers.urlshort-graf.tls=true
      - traefik.http.services.urlshort-graf.loadbalancer.server.port=3000
    depends_on:
      - prometheus
      - tempo

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener}
      POSTGRES_DB: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  pgdata_mono:

networks:
  coolify:
    external: true
